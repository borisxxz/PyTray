# PyTray — 测试 + 打包 Windows exe
# push / PR：跑单测并产出 dist/PyTray.exe 工件
# 推送 v* 标签：额外创建 GitHub Release 并挂上 PyTray.exe
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Unit tests
        run: python tests/test_units.py

      - name: Build PyTray.exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name PyTray --icon PyTray.ico
          --collect-all customtkinter
          pytray.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyTray-exe
          path: dist/PyTray.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PyTray.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
