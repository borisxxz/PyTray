# PyTray — CNB 云原生构建（不使用自托管 Runner）
#
# 架构：PyInstaller 只能在 Windows 上出 .exe，CNB 官方节点是 Linux。
# 由 GitHub Actions（windows-latest）真正打包；本流水线在官方云节点上：
#   1) main 推送 → 语法检查
#   2) v* 标签   → 等 GitHub Release 出包 → 下载 → 发布到 CNB Release
# 不依赖任何一台个人电脑。
#
# 注意：tag 事件用 glob「v*」精确匹配（比 $ 兜底更稳），与 git tag v1.x.x 对齐。

# ---------- v* 标签：取 GitHub 产物并发布 CNB Release ----------
"v*":
  tag_push:
    - name: publish-release-from-github
      docker:
        image: python:3.12-slim
      env:
        GITHUB_REPO: borisxxz/PyTray
        EXE_NAME: PyTray.exe
        WAIT_TIMEOUT_SEC: "1800"
      stages:
        - name: download exe from GitHub release
          script: python ci/download_exe.py

        # 内置任务：按 tag 创建/更新 Release（标题默认取 tag 名）
        - name: create release
          type: git:release
          options:
            description: |
              自动发布产物 PyTray.exe（单文件、无控制台、内嵌图标）。
              实际打包由 GitHub Actions 完成后同步到本 Release。
              用法：双击即用；可选将 PyTray.ico 放在同目录。

        # 官方云节点带 Docker，可直接用附件插件
        - name: upload attachment
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - ./dist/PyTray.exe

# ---------- main 推送：语法检查 ----------
main:
  push:
    - name: syntax-check
      docker:
        image: python:3.12-slim
      stages:
        - name: py_compile
          script: |
            python -m py_compile pytray.py hotkey_probe.py check_hotkey.py tests/test_units.py ci/download_exe.py
            echo "syntax OK"
